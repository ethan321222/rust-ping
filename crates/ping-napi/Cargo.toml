[package]
name = "ping-napi"
version = "1.0.0"
edition = "2021"
description = "Node.js/Bun native addon for ICMP ping"

[lib]
crate-type = ["cdylib"]

[dependencies]
ping-core = { path = "../ping-core" }
napi = { version = "2", features = ["napi9"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
